name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and attach installers to (e.g. v0.3.2)
        required: true

# A newer push to main supersedes an older one that is still building, so quick
# successive pushes don't pile up in the runner queue. Release builds (tag pushes
# and dispatches) each get their own group and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # fake Google TV / Cast / Samsung / LG / Roku servers on 127.0.0.1; disorderly connection sequences
      - run: node test/stress-drivers.test.js
      # the real app headless: floods, a resize storm, hostile strings and a short soak (report + screenshots kept as an artifact)
      - run: STRESS_SOAK_MS=30000 SHOT_DIR=stress-ui xvfb-run -a npx electron --no-sandbox test/stress-ui.js
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: stress-ui, path: stress-ui, if-no-files-found: ignore }

  # Installers are built for releases only (a v* tag, or the workflow dispatched with a tag) and attached
  # to the GitHub Release. Pushes run the tests alone, so a push never queues a macOS build: GitHub's
  # hosted macOS arm64 runners are capacity constrained and a job they can't place within 15 minutes is
  # cancelled ("not acquired by Runner of type hosted"), which is how releases were lost.
  package:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: package:mac
          - os: windows-latest
            script: package:win
          - os: ubuntu-latest
            script: package:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Unsigned by default (macOS bundles are ad-hoc signed by scripts/afterPack.js).
      # Add repository secrets to sign for real: CSC_LINK (base64 .p12) + CSC_KEY_PASSWORD,
      # and APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID for notarization.
      # electron-builder treats an *empty* CSC_LINK as a path, so only export the variables when set.
      - shell: bash
        env:
          IN_CSC_LINK: ${{ secrets.CSC_LINK }}
          IN_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          IN_APPLE_ID: ${{ secrets.APPLE_ID }}
          IN_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          IN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$IN_CSC_LINK" ]; then
            export CSC_LINK="$IN_CSC_LINK" CSC_KEY_PASSWORD="$IN_CSC_KEY_PASSWORD" CSC_IDENTITY_AUTO_DISCOVERY=true
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -n "$IN_APPLE_ID" ]; then
            export APPLE_ID="$IN_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$IN_APPLE_APP_SPECIFIC_PASSWORD" APPLE_TEAM_ID="$IN_APPLE_TEAM_ID"
          fi
          npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: Android-TV-Controller-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          shopt -s globstar nullglob
          files=(artifacts/**/*.dmg artifacts/**/*.zip artifacts/**/*.exe artifacts/**/*.AppImage artifacts/**/*.deb artifacts/**/latest*.yml artifacts/**/*.blockmap)
          echo "attaching ${#files[@]} files to $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --draft=false
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --target "${{ github.sha }}" "${files[@]}"
          fi
